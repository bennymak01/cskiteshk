name: Publish Scheduled Posts

on:
  schedule:
    # 早上 9am HKT (UTC+8) = 1am UTC
    - cron: '0 1 * * 5'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish due posts
        run: |
          CURRENT_DATE=$(date +%Y-%m-%d)
          mkdir -p blog
          for file in _drafts/*.md; do
            [ -e "$file" ] || continue
            filename=$(basename "$file")
            post_date=$(echo "$filename" | cut -c1-10)
            if [[ "$post_date" <= "$CURRENT_DATE" ]]; then
              slug=$(echo "$filename" | cut -c12- | sed 's/\.md$//')
              mv "$file" "blog/$filename"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git diff --staged --quiet && echo "No posts to publish" && exit 0
          git commit -m "Auto-publish scheduled posts: $(date +%Y-%m-%d)"
          git push origin HEAD
