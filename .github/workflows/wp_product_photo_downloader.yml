name: Download WP Product Photos

on:
  workflow_dispatch:
    inputs:
      item_code:
        description: 'Item code to update (leave blank for all missing products)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow

      - name: Download product photos from csstationery.hk
        run: |
          CODE="${{ github.event.inputs.item_code }}"
          if [ -n "$CODE" ]; then
            python scripts/wp_photo_downloader.py --item-code "$CODE"
          else
            python scripts/wp_photo_downloader.py
          fi

      - name: Commit and push images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/products/ catalogue/images/
          git commit -m "chore: download product photos from csstationery.hk" || echo "No changes to commit"
          git push
