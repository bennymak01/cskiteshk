name: Scheduled Blog Publishing

on:
  # Schedule paused — enable by uncommenting the cron line below.
  # Runs every Monday at 9:00 AM HKT (UTC 1:00 AM).
  # schedule:
  #   - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install markdown
      - name: Move due drafts to _posts
        run: python publish_drafts.py
      - name: Generate post pages and inject blog cards
        run: python publish_posts.py
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ _posts/ _drafts/
          git commit -m "Auto-publish scheduled blog posts" || echo "No changes to commit"
          git push
